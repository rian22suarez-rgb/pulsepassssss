services:
  postgres:
    image: postgres:18
    container_name: pulsepass-postgres
    environment:
      POSTGRES_DB: pulsepass_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - pulsepass_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsepass_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsepass_pgdata: