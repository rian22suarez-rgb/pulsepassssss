<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulsePass: descubre eventos y gestiona tus entradas." />
    <title>PulsePass — Eventos y entradas</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (FR-FE-GEN-004).
      try {
        const t = localStorage.getItem('pp-tema')
        const oscuro = t ? t === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
